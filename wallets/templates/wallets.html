<h1>Wallets</h1>
{% for wallet in wallets %}
<ul>
    <li>{{wallet.bank_name}}</li>
    <ul>
        <li>{{wallet.account_code}}</li>
    </ul>
    <form action="{% url 'delete_wallet' wallet.id %}" method="POST">
        {% csrf_token %}
        <button>Delete</button>
    </form>
    <form action="{% url 'update_wallet' wallet.id %}" method="GET">
        {% csrf_token %}
        <button>Update</button>
    </form>
</ul>
{% endfor %}
